# Pins the toolchain so local dev and CI use the same versions.
# `mise install` sets these up; CI installs them via jdx/mise-action.
# rust is also pinned in rust-toolchain.toml (mise and rustup both read it);
# keep the two at the same version.
[tools]
# profile = "default" so clippy and rustfmt are installed (mise defaults rust to
# the minimal profile, which omits them).
rust = { version = "1.97.0", profile = "default" }
python = "3.12"

# Dev tasks: `mise tasks` to list, `mise run <name>` to run.

[tasks.build]
description = "Build the workspace core (release)"
alias = "b"
run = "cargo build --release"

[tasks.test]
description = "Run all workspace tests (unit + integration)"
alias = "t"
run = "cargo test --workspace"

[tasks.test-pipeline]
description = "Run the orchestrator end-to-end pipeline test"
run = "cargo test -p assayist --test pipeline"

[tasks.test-gate]
description = "Run the gate scenario suite: six verdicts and exit codes"
run = "bash scripts/verify-gate.sh"

[tasks.lint]
description = "Clippy with warnings denied (matches CI)"
run = "cargo clippy --workspace --all-targets -- -D warnings"

[tasks.lint-gadgets]
description = "Clippy the capture gadgets (excluded from the workspace, so `lint` skips them). Needs a BTF host + clang for the eBPF ones; resident is pure userspace."
run = """
set -e
for g in kvm block net ctrlplane resident; do
  echo "clippy: capture/$g"
  cargo clippy --manifest-path "capture/$g/Cargo.toml" --all-targets -- -D warnings
done
"""

[tasks.fmt]
description = "Format the workspace with rustfmt"
run = "cargo fmt --all"

[tasks.ci]
description = "Everything CI runs: lint, tests, gate suite"
depends = ["lint", "test", "test-gate"]

[tasks.testdata]
description = "Generate synthetic gate runs into a dir (default /tmp/runs)"
usage = 'arg "[dir]" help="output directory" default="/tmp/runs"'
run = "python3 scripts/gen_testdata.py ${usage_dir}"

[tasks.demo]
description = "Generate runs and judge B vs A with the gate (runs anywhere)"
run = [
  "python3 scripts/gen_testdata.py /tmp/runs",
  "cargo run --release -p assayist-gate -- --mode ab_permutation --a /tmp/runs/a*.json --b /tmp/runs/bsame*.json",
]

[tasks.inspect]
description = "Parse, validate and observe the example def (read-only)"
run = "cargo run --release -p assayist -- inspect examples/firecracker-boot-snapshot.assay.yaml"

[tasks.release]
description = "Cut a GitHub release (build orchestrator + gadgets, package, gh release create). Needs a BTF+KVM host with clang + bpftool. Pass the version: mise run release -- v0.1.0 (DRY_RUN=1 to skip publishing)."
run = "scripts/release.sh"
