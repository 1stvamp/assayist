[package]
name = "assayist"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Assayist orchestrator: run benchmark defs, capture, assemble AssayRuns, gate"
readme = "README.md"
keywords = ["benchmark", "ebpf", "firecracker", "kvm", "microvm"]
categories = ["development-tools::profiling", "development-tools::testing"]

[[bin]]
name = "assayist"
path = "src/main.rs"

[dependencies]
assayist-contract.workspace = true
assayist-otlp.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
libc = "0.2"
