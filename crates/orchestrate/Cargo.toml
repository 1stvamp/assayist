[package]
name = "assayist-orchestrate"
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"
description = "Assayist orchestrator: run benchmark defs, capture, assemble AssayRuns, gate"

[[bin]]
name = "assayist"
path = "src/main.rs"

[dependencies]
assayist-contract = { path = "../contract" }
assayist-otlp = { path = "../otlp" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
libc = "0.2"
