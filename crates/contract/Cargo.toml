[package]
name = "assayist-contract"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Typed producer-side model of the Assayist metric contract"
readme = "README.md"
keywords = ["benchmark", "ebpf", "otlp", "firecracker", "kvm"]
categories = ["development-tools::profiling", "development-tools::testing"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# Validates real instances against contract/assay-run.schema.json in tests, so
# the schema is exercised (a labelled series validates, a malformed one is
# rejected), not just parsed for shape. Dev-only: not carried by consumers.
jsonschema = "0.18"
