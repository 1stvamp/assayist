# Assayist workspace.
#
# The workspace members are the host-agnostic core: the contract types, the
# gate, and the orchestrator. They build anywhere stable Rust runs.
#
# The eBPF capture gadgets under capture/* are deliberately NOT workspace
# members (they are listed in `exclude`). They need a BTF-enabled Linux host
# with clang + bpftool to build, and the orchestrator invokes them as separate
# binaries emitting JSON fragments, not as linked crates. Build them per-host:
#   cd capture/kvm && cargo build --release
[workspace]
resolver = "2"
members = [
    "crates/contract",
    "crates/gate",
    "crates/orchestrate",
    "crates/otlp",
]
exclude = [
    "capture/kvm",
    "capture/block",
    "capture/net",
    "capture/ctrlplane",
    "capture/resident",
    "capture/netattrib",
]

# Shared package metadata, inherited by each crate with `<field>.workspace = true`
# so the core publishes to crates.io in lockstep. Bump `version` here to move the
# whole core; the release tag (scripts/release.sh) and the crates share it.
[workspace.package]
version = "0.1.3"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/1stvamp/assayist"
rust-version = "1.97"

# Internal crates carry a version alongside the path so `cargo publish` (which
# strips the path) has a version requirement to record. Keep these at the
# workspace version.
[workspace.dependencies]
assayist-contract = { path = "crates/contract", version = "0.1.3" }
assayist-otlp = { path = "crates/otlp", version = "0.1.3" }

[profile.release]
opt-level = 2
