name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    # Workspace core only (contract, gate, orchestrate, otlp). The eBPF gadgets
    # under capture/ are excluded from the workspace: they need a BTF-enabled
    # host with clang + bpftool, so they are not built here.
    name: build / test / lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain (rust + python from mise.toml)
        uses: jdx/mise-action@v4

      - name: Ensure clippy and rustfmt
        # mise installs rust via rustup; add the components explicitly rather
        # than relying on the toolchain profile, which mise-action has dropped
        # on install before. Idempotent if they are already present.
        run: rustup component add clippy rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Clippy the resident gadget (pure userspace, no BTF)
        # The eBPF gadgets need a BTF host + clang, so they cannot be linted on a
        # stock runner; they are gated in scripts/release.sh instead (mise run
        # lint-gadgets). resident is pure userspace, so lint it here on every PR.
        run: cargo clippy --manifest-path capture/resident/Cargo.toml --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Gate scenario suite
        # Regenerates synthetic runs and checks all six verdicts and exit codes.
        run: bash scripts/verify-gate.sh
