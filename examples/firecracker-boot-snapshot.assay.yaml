# A benchmark definition. Committed next to the code under test; its hash
# becomes identity.benchmark_def_sha in every AssayRun it produces.
apiVersion: assayist/v0
name: firecracker-boot-snapshot
target:
  adapter: firecracker
  version: ">=0.3"
  # Native firecracker adapter settings. vcpu/mem_mib come from the cell; the
  # rest configure the microVM. Set from_snapshot+mem_file for restore-mode runs.
  config:
    bin: firecracker
    kernel: /var/lib/assayist/vmlinux
    rootfs: /var/lib/assayist/rootfs.ext4
    boot_args: "console=ttyS0 reboot=k panic=1"
workload:
  driver: fio-libaio
  # Native fio adapter settings. Values may reference cell params as {name}.
  config:
    filename: /dev/vdb
    rw: randread
    bs: 4k
    iodepth: 32
    runtime: 30
gate:
  mode: ab_permutation
  p_threshold: 0.01
  noise_threshold: 0.05
  resamples: 10000
  ignore: []
parameterise:
  vcpu: [1, 2, 4]
  mem_mib: [256, 512]
capture:
  - probe: kvm_exit
    gadget: assayist-capture-kvm
    cardinality: { class: singleton }
  - probe: block_rq_complete
    gadget: assayist-capture-block
    cardinality: { class: bounded, key_source: device, max_keys: 256 }
host_prep:
  cpu_governor: performance
  smt: off
  thp: never
  pin_threads: true
tenancy: single_tenant
