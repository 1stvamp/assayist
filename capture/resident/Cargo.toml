# SPDX-License-Identifier: Apache-2.0
[package]
name = "assayist-capture-resident"
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"
description = "Snapshot residency capture (mincore on the mem file) for Assayist"

[[bin]]
name = "assayist-capture-resident"
path = "src/main.rs"

[dependencies]
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
libc = "0.2"
