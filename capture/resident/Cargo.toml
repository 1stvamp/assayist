# SPDX-License-Identifier: Apache-2.0
# Excluded from the workspace (see the root Cargo.toml), so metadata is set
# explicitly here rather than inherited. Keep the version in step with the core
# (workspace.package version) when releasing. This is the one gadget that is pure
# userspace, so it is the only one publishable to crates.io.
[package]
name = "assayist-capture-resident"
version = "0.1.3"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/1stvamp/assayist"
rust-version = "1.97"
description = "Snapshot residency capture (mincore on the mem file) for Assayist"
readme = "README.md"
keywords = ["benchmark", "mincore", "residency", "firecracker", "snapshot"]
categories = ["development-tools::profiling"]

[[bin]]
name = "assayist-capture-resident"
path = "src/main.rs"

[dependencies]
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
libc = "0.2"
