[package]
name = "assayist-capture-block"
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"
description = "Host-side block-IO latency capture for Assayist"

[[bin]]
name = "assayist-capture-block"
path = "src/main.rs"

[dependencies]
libbpf-rs = "0.24"
libbpf-sys = "1.4"
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"

[build-dependencies]
libbpf-cargo = "0.24"
